/* Fuentes de FITBOX. Futura es la de títulos: viene instalada en iPhone, iPad y Mac.
   Donde no está (Android, Windows) se usa Jost, una versión libre muy parecida.
   Metropolis es la del texto y va incluida en la app. */
@font-face{font-family:"Jost";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/jost-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Metropolis";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/metropolis-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Metropolis";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/metropolis-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Metropolis";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/metropolis-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Metropolis";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/metropolis-latin-700-normal.woff2) format("woff2")}
/* Layout: app de una mano. Barra negra arriba con la marca, contenido en tarjetas, barra de pestañas negra abajo.
   Colores de marca: naranja #FAA300, negro #000000, gris oscuro #4B4B4B, gris claro #EBEBEB. */
:root{
  --brand:#FAA300; --black:#000000; --graphite:#4B4B4B; --mist:#EBEBEB;
  --bg:var(--mist); --surface:#ffffff; --ink:var(--black); --muted:var(--graphite); --line:#d4d4d4; --chip:var(--mist);
  --accent:var(--brand); --accent-ink:var(--black); --accent-soft:#fdeccb; --accent-fg:#8f5600;
  --bar:var(--black); --bar-ink:var(--mist); --bar-muted:#a8a8a8; --bar-line:#262626;
  --focus:var(--black);
  --good:#1e7444; --good-soft:#dcefe2; --warn:#8f5600; --warn-soft:#fdeccb; --bad:#b3261e; --bad-soft:#f8dcd9;
  --scrim:rgba(0,0,0,.5);
  --display:"Futura","Futura PT","Jost","Century Gothic",system-ui,sans-serif;
  --body:"Metropolis",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--black); --surface:#161616; --ink:var(--mist); --muted:#a8a8a8; --line:#2e2e2e; --chip:#262626;
  --accent-soft:#3a2700; --accent-fg:var(--brand); --bar-line:#262626; --focus:var(--brand);
  --good:#5cc88a; --good-soft:#12301f; --warn:var(--brand); --warn-soft:#3a2700; --bad:#ff7b6e; --bad-soft:#3d1a17;
  --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--black); --surface:#161616; --ink:var(--mist); --muted:#a8a8a8; --line:#2e2e2e; --chip:#262626;
  --accent-soft:#3a2700; --accent-fg:var(--brand); --bar-line:#262626; --focus:var(--brand);
  --good:#5cc88a; --good-soft:#12301f; --warn:var(--brand); --warn-soft:#3a2700; --bad:#ff7b6e; --bad-soft:#3d1a17;
  --scrim:rgba(0,0,0,.65); color-scheme:dark}

.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:15px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:12px 20px;min-height:48px}

nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{position:relative;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--bar-muted);padding:9px 2px 9px;min-height:60px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brand)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
nav.tabs button:active{transform:none}
/* código en el panel */
.codecard{text-align:left;font-weight:inherit}
.codecard .codev{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
/* cuentas bancarias */
.acct{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.acct:first-child{border-top:0;padding-top:0}
.acct .bank{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em}
.acct .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.copynum{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--bg);border:1px dashed var(--line);text-align:left;padding:10px 12px}

/* agenda */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;min-height:54px;border-radius:10px;font-size:12px}

.slot.now .h{color:var(--accent-fg);font-weight:700}
/* barras */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.bar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar .fill{height:100%;background:var(--bad);border-radius:4px}
.bar.in .fill{background:var(--good)}
/* hoja */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .err{color:var(--bad);font-weight:600;font-size:14px}
.sheet .err:empty{display:none}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px);text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{min-height:34px;padding:4px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plan-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) 44px;gap:6px;align-items:end}
.plan-row button{min-height:44px;padding:0}
.code{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:.08em;line-height:1;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){button,.btn{transition:none}button:active,.btn:active{transform:none}}
</style>

<script>
(() => {
"use strict";
const DEF = {capacidad:4, apertura:6, cierre:23, apDom:8, ciDom:22, moneda:"L", aviso:5, cuentas:["Efectivo","BAC"],
  planes:[{nombre:"Mensual",dias:30,precio:400},{nombre:"Semanal",dias:7,precio:150},{nombre:"Por hora",dias:0,precio:40}]};
const GASTOS = ["Renta","Luz y agua","Internet y teléfono","Equipo","Mantenimiento","Insumos y limpieza","Publicidad","Sueldos","Retiro personal","Préstamos","Ajuste de caja","Otro"];
const INGRESOS = ["Membresía","Pago por hora","Venta de productos","Aporte del dueño","Préstamos","Ajuste de caja","Otro"];
const COL = {clientes:"clientes", reservas:"reservas", movs:"movimientos", mant:"mantenimientos", insumos:"insumos", codigos:"codigos"};
const S = {clientes:[], reservas:[], movs:[], mant:[], insumos:[], codigos:[], config:null, loaded:0, dbOk:null};
const TITLES = {panel:"Panel", clientes:"Clientes", agenda:"Agenda", dinero:"Dinero", mas:"Local y ajustes"};
let db = null, view = "panel", agendaDay = today(), mes = today().slice(0,7), filtro = "activos", busca = "";

// ---------- utilidades ----------
function pad(n){return String(n).padStart(2,"0")}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return fmt(new Date())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+Number(n));return fmt(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function fdate(s,o){return s?parse(s).toLocaleDateString("es",o||{day:"numeric",month:"short"}):"—"}
function fh(h){const H=Math.floor(h),m=h%1?"30":"00",ap=H<12?"am":"pm";return ((H+11)%12+1)+":"+m+" "+ap}
function nowH(){const d=new Date();return d.getHours()+d.getMinutes()/60}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cfg(){const c={...DEF,...(S.config||{})};if(!Array.isArray(c.planes)||!c.planes.length)c.planes=DEF.planes;if(!Array.isArray(c.cuentas)||!c.cuentas.length)c.cuentas=DEF.cuentas;return c}
function money(n){return esc(cfg().moneda)+" "+Number(n||0).toLocaleString("es",{minimumFractionDigits:0,maximumFractionDigits:2})}
function cli(id){return S.clientes.find(c=>c.id===id)}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function estado(c){
  if(!c.vence) return {k:"",t:"Sin plan",d:-9999};
  const d=diff(today(),c.vence);
  if(d<0) return {k:"bad",t:"Vencido hace "+(-d)+" d",d};
  if(d===0) return {k:"warn",t:"Vence hoy",d};
  if(d<=cfg().aviso) return {k:"warn",t:"Vence en "+d+" d",d};
  return {k:"good",t:"Activo · "+d+" d",d};
}
const activos = () => S.clientes.filter(c=>!c.baja && c.vence && c.vence>=today());
const porVencer = () => activos().filter(c=>diff(today(),c.vence)<=cfg().aviso);
const suelto = c => cfg().planes.some(p=>p.nombre===c.plan&&p.dias===0);
const nombreRes = r => (cli(r.clienteId)?.nombre) || r.nombre || "Cliente";
function overlaps(r,a,b){return r.inicio<b && (r.inicio+r.dur)>a}
function resDia(f){return S.reservas.filter(r=>r.fecha===f).sort((a,b)=>a.inicio-b.inicio)}
function movsMes(m){return S.movs.filter(x=>x.fecha&&x.fecha.slice(0,7)===m)}
function sum(a){return a.reduce((s,x)=>s+Number(x.monto||0),0)}

// ---------- guardar ----------
async function write(fn){
  if(!db){toast("No hay conexión con el almacenamiento");return false}
  try{await fn();return true}catch(e){
    if(e&&e.code==="unavailable"){try{await new Promise(r=>setTimeout(r,600+Math.random()*600));await fn();return true}catch(e2){e=e2}}
    toast(e&&e.code==="quota_exceeded"?"El almacenamiento está lleno":"No se pudo guardar. Intenta de nuevo.");return false}
}
const add=(col,data)=>write(()=>db.collection(col).add(data));
const upd=(col,id,data)=>write(()=>db.collection(col).doc(id).update(data));
const del=(col,id)=>write(()=>db.collection(col).doc(id).delete());

// ---------- hoja (formularios) ----------
let sheetEl=null;
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null}}
function sheet({title,body,submit="Guardar",onSubmit,onInput,onClick,extra=""}){
  closeSheet();
  const sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML=`<form class="sheet" novalidate><div class="row between"><h2>${esc(title)}</h2><button type="button" class="small" data-close>Cerrar</button></div>${body}<div class="err" id="sh-err"></div>${onSubmit?`<div class="btns">${extra}<button type="submit" class="primary">${esc(submit)}</button></div>`:extra?`<div class="btns">${extra}</div>`:""}</form>`;
  const form=sc.querySelector("form");
  sc.addEventListener("click",e=>{if(e.target===sc||e.target.closest("[data-close]")){closeSheet();return}
    const b=e.target.closest("[data-s]");if(b&&onClick){if(b.tagName!=="A")e.preventDefault();onClick(b.dataset.s,b,form)}});
  if(onInput) form.addEventListener("input",e=>onInput(form,e));
  form.addEventListener("submit",async e=>{e.preventDefault();if(!onSubmit)return;
    const data=Object.fromEntries(new FormData(form));const btn=form.querySelector("[type=submit]");btn.disabled=true;
    const r=await onSubmit(data,form);btn.disabled=false;
    if(typeof r==="string"){form.querySelector("#sh-err").textContent=r}else if(r!==false){closeSheet()}});
  document.body.appendChild(sc);sheetEl=sc;
  const f=form.querySelector("input:not([type=hidden]),select");if(f&&f.type!=="date")setTimeout(()=>f.focus({preventScroll:true}),50);
  return form;
}
// botón de borrar con doble toque
function confirmBtn(b,go){if(b.dataset.armed){go();return}b.dataset.armed="1";const t=b.textContent;b.textContent="Toca otra vez para confirmar";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t}},3000)}

    body:`<label>Nombre<input name="nombre" id="f-nombre" required value="${esc(c.nombre)}" autocomplete="off"></label>

      <label>Inicia<input type="date" name="inicio" id="f-inicio" value="${today()}"></label></div>

      <div class="grid2"><label>Monto pagado<input name="monto" id="f-monto" inputmode="decimal" value="${p0.precio||""}"></label><label>Pagó en<select name="cuenta" id="f-cuenta">${cuentaOpts()}</select></label></div>`

      <label>Notas<textarea name="notas" id="f-notas" rows="2" placeholder="Objetivo, lesiones, horario preferido…">${esc(c.notas)}</textarea></label>`,

      if(!nuevo) return upd(COL.clientes,c.id,{nombre:d.nombre.trim(),telefono:d.telefono.trim(),notas:d.notas.trim(),vence:d.vence||null});
      const p=cfg().planes[d.plan];const monto=parseFloat(String(d.monto).replace(",","."))||0;
      const vence=addDays(d.inicio||today(),p.dias);
      const ref=db&&db.collection(COL.clientes).doc();
      const ok=await write(()=>ref.set({nombre:d.nombre.trim(),telefono:d.telefono.trim(),notas:d.notas.trim(),plan:p.nombre,inicio:d.inicio,vence,alta:today()}));

      if(ok) toast("Cliente guardado");return ok;
    }});
}
function cobrar(c){
  const idx=Math.max(0,cfg().planes.findIndex(p=>p.nombre===c.plan));
  const calc=(f)=>{const p=cfg().planes[f.plan.value];const fp=f.fecha.value||today();const base=(c.vence&&c.vence>=fp)?c.vence:fp;f.vence.value=addDays(base,p.dias)};
  const f=sheet({title:"Renovar plan de "+c.nombre,
    body:`<p class="sub">${c.vence?"Su plan "+(c.vence>=today()?"vence":"venció")+" el "+fdate(c.vence,{day:"numeric",month:"long"})+". Si paga antes, los días se suman a partir de esa fecha.":"Aún no tiene un plan registrado."}</p>
      <label>Plan<select name="plan" id="c-plan">${planOpts(cfg().planes[idx].nombre)}</select></label>
      <div class="grid2"><label>Monto<input name="monto" id="c-monto" inputmode="decimal" value="${cfg().planes[idx].precio||""}"></label>
      <label>Fecha de pago<input type="date" name="fecha" id="c-fecha" value="${today()}"></label></div>
      <label>Pagó en<select name="cuenta" id="c-cuenta">${cuentaOpts()}</select></label>
      <label>Nuevo vencimiento<input type="date" name="vence" id="c-vence"></label>`,
    submit:"Registrar pago",
    onInput:(f,e)=>{if(e.target.name==="plan"){f.monto.value=cfg().planes[f.plan.value].precio||""}if(e.target.name!=="vence")calc(f)},
    onSubmit:async d=>{const monto=parseFloat(String(d.monto).replace(",","."));if(!(monto>0))return "Escribe el monto que pagó.";
      const p=cfg().planes[d.plan];
      const ok=await add(COL.movs,{tipo:"ingreso",categoria:p.dias<=1?"Pago por hora":"Membresía",monto,cuenta:d.cuenta,fecha:d.fecha||today(),descripcion:p.nombre+" · "+c.nombre,clienteId:c.id});
      if(ok){await upd(COL.clientes,c.id,{plan:p.nombre,vence:d.vence,baja:false});toast("Pago registrado")}return ok}});
  calc(f);
}

    onClick:(a,b)=>{

      if(a==="baja"){upd(COL.clientes,c.id,c.baja?{baja:false,reactivado:today()}:{baja:true});closeSheet()}

// ---------- WhatsApp ----------
function waNum(t){let d=String(t||"").replace(/\D/g,"");if(d.length===8)d="504"+d;return d.length>=10?d:null}
function waMsg(c){
  const n=c.nombre.split(" ")[0],e=estado(c),p=cfg().planes.find(x=>x.nombre===c.plan),precio=p&&p.precio?" Son "+money(p.precio)+".":"";
  if(!c.vence)return `Hola ${n}, ¿cómo estás? `;
  const f=fdate(c.vence,{weekday:"long",day:"numeric",month:"long"});
  if(e.d<0)return `Hola ${n}, ¿cómo estás? Tu plan ${(c.plan||"").toLowerCase()} venció el ${f}. ¿Te gustaría renovarlo para seguir entrenando?${precio} ¡Te esperamos!`;
  if(e.d<=cfg().aviso)return `Hola ${n}, te recuerdo que tu plan ${(c.plan||"").toLowerCase()} vence ${e.d===0?"hoy":"el "+f}. Para renovarlo puedes pagar en efectivo o por transferencia.${precio} ¡Gracias por entrenar en FITBOX!`;
  return `Hola ${n}, ¿cómo estás? `;
}
function waLink(c,msg){return "https://wa.me/"+waNum(c.telefono)+"?text="+encodeURIComponent(msg)}
function whats(c){
  if(!waNum(c.telefono)){formCliente(c);setTimeout(()=>toast("Agrega el número de "+c.nombre+" para enviarle WhatsApp"),60);return}
  const m=waMsg(c);
  sheet({title:"WhatsApp a "+c.nombre,
    body:`<label>Mensaje<textarea name="msg" id="w-msg" rows="6">${esc(m)}</textarea></label>
      <p class="sub">Se enviará a +${waNum(c.telefono)}. Puedes cambiar el texto antes de abrir WhatsApp.</p>
      ${bancos().length?'<button type="button" class="small" data-s="cuentas">Agregar mis cuentas al mensaje</button>':""}
      <a class="btn primary" id="w-go" href="${esc(waLink(c,m))}" target="_blank" rel="noopener">Abrir WhatsApp</a>`,
    onInput:f=>{f.querySelector("#w-go").href=waLink(c,f.msg.value)},
    onClick:(a,b,f)=>{if(a==="cuentas"){f.msg.value=f.msg.value.trimEnd()+"\n\n"+textoCuentas();f.querySelector("#w-go").href=waLink(c,f.msg.value);b.remove()}}});
}

// ---------- código de acceso ----------
const codigos=()=>[...S.codigos].sort((a,b)=>(b.desde+b.creado).localeCompare(a.desde+a.creado));
const vigente=()=>codigos().find(c=>c.desde<=today())||null;
function nuevoCodigo(){const usados=new Set(S.codigos.map(c=>c.codigo));let c;
  do{const a=new Uint32Array(1);crypto.getRandomValues(a);c=String(a[0]%1000000).padStart(6,"0")+"#"}while(usados.has(c)||/^(\d)\1{5}/.test(c));return c}
// copia al portapapeles; si el navegador no deja, usa el método antiguo
async function copiar(txt,ok="Código copiado"){
  let hecho=false;
  try{await navigator.clipboard.writeText(txt);hecho=true}catch(e){
    try{const t=document.createElement("textarea");t.value=txt;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(t);t.select();t.setSelectionRange(0,txt.length);hecho=document.execCommand("copy");t.remove()}catch(e2){}}
  toast(hecho?ok:"No se pudo copiar. Mantén presionado el texto para copiarlo.");return hecho}
function formCodigo(){
  const ref={c:nuevoCodigo()};
  const msg=c=>`Hola, el nuevo código de acceso a FITBOX es ${c}. Por favor no lo compartas. ¡Buen entrenamiento!`;
  sheet({title:"Nuevo código de acceso",
    body:`<div class="row between"><span class="code" id="k-code">${ref.c}</span><button type="button" class="small" data-s="otro">Generar otro</button></div>
      <div class="grid2"><label>Vigente desde<input type="date" name="desde" id="k-desde" value="${today()}"></label>
      <label>Nota<input name="nota" id="k-nota" placeholder="Opcional"></label></div>
      <label class="check"><input type="checkbox" name="manual" id="k-manual"> Escribirlo yo</label>
      <label id="k-man-l" hidden>Código<input name="codigo" id="k-man" inputmode="numeric" placeholder="123456#"></label>
      <p class="sub">Formato: 6 números seguidos de #. No se repite ningún código que ya usaste.</p>`,
    submit:"Guardar como vigente",
    onClick:(a,b,f)=>{if(a==="otro"){ref.c=nuevoCodigo();f.querySelector("#k-code").textContent=ref.c}},
    onInput:(f)=>{f.querySelector("#k-man-l").hidden=!f.manual.checked},
    onSubmit:async d=>{let c=ref.c;if(d.manual){c=String(d.codigo||"").replace(/\s/g,"");if(/^\d{6}$/.test(c))c+="#";if(!/^\d{6}#$/.test(c))return "El código debe tener 6 números seguidos de #, por ejemplo 482913#."}
      if(S.codigos.some(x=>x.codigo===c))return "Ya usaste ese código antes. Genera otro.";
      const ref2=db&&db.collection(COL.codigos).doc();
      const ok=await write(()=>ref2.set({codigo:c,desde:d.desde||today(),creado:new Date().toISOString(),nota:d.nota.trim(),enviados:[]}));
      if(ok){toast("Código guardado");setTimeout(()=>compartirCodigo({id:ref2.id,codigo:c,enviados:[]}),80)}return ok}});
  compartirCodigo.msg=msg;
}
function compartirCodigo(k){
  const txt=(n)=>`Hola${n?" "+n:""}, el nuevo código de acceso a FITBOX es ${k.codigo}. Por favor no lo compartas. ¡Buen entrenamiento!`;
  const env=new Set((S.codigos.find(x=>x.id===k.id)||k).enviados||[]);
  const act=activos().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const fila=c=>{const n=c.nombre.split(" ")[0],num=waNum(c.telefono);
    return `<div class="item"><span class="grow t">${esc(c.nombre)}</span>${num?`<a class="btn small ${env.has(c.id)?"":"primary"}" data-s="env" data-id="${c.id}" href="https://wa.me/${num}?text=${encodeURIComponent(txt(n))}" target="_blank" rel="noopener" >${env.has(c.id)?"Enviado ✓":"Enviar"}</a>`:`<button type="button" class="small" data-s="tel" data-id="${c.id}">Agregar número</button>`}</div>`};
  sheet({title:"Enviar "+k.codigo,body:`<p class="sub">Toca <b>Enviar</b> en cada cliente activo. Se abre su chat con el mensaje listo; envíalo y regresa aquí para el siguiente.</p>
    <div class="list">${act.length?act.map(fila).join(""):'<div class="empty">No hay clientes activos.</div>'}</div>
    <div class="btns"><button type="button" data-s="copiar">Copiar código</button><a class="btn" data-s="grupo" href="https://wa.me/?text=${encodeURIComponent(txt(""))}" target="_blank" rel="noopener">Enviar a un grupo</a></div>`,
    onClick:async(a,b)=>{
      if(a==="copiar")copiar(k.codigo);
      if(a==="tel"){const c=cli(b.dataset.id);if(c)formCliente(c)}
      if(a==="env"&&k.id&&!env.has(b.dataset.id)){env.add(b.dataset.id);b.textContent="Enviado ✓";b.classList.remove("primary");upd(COL.codigos,k.id,{enviados:[...env]})}
    }});
}
function verCodigo(id){const k=S.codigos.find(x=>x.id===id);if(!k)return;
  sheet({title:"Código "+k.codigo,body:`<dl class="kv"><dt>Vigente desde</dt><dd>${fdate(k.desde,{day:"numeric",month:"long",year:"numeric"})}</dd><dt>Enviado a</dt><dd>${esc(k.nota||"—")}</dd><dt>Enviado por WhatsApp</dt><dd>${(k.enviados||[]).length?(k.enviados||[]).map(i=>esc(cli(i)?.nombre||"")).join(", "):"—"}</dd></dl>
    <div class="btns"><button type="button" data-s="enviar">Enviar</button><button type="button" class="danger" data-s="borrar">Eliminar</button></div>`,
    onClick:(a,b)=>{if(a==="enviar")compartirCodigo(k);if(a==="borrar")confirmBtn(b,async()=>{await del(COL.codigos,k.id);closeSheet()})}});
}

// ---------- cuentas bancarias ----------
// Se guardan en la configuración (en Supabase, privadas), no en el código, porque el repositorio es público.
const bancos=()=>Array.isArray(S.config?.bancos)?S.config.bancos:[];
const soloNum=n=>String(n||"").replace(/\s/g,"");
function textoCuenta(b){return [b.banco+(b.tipo?" · "+b.tipo:""),soloNum(b.numero),b.titular?"A nombre de "+b.titular:""].filter(Boolean).join("\n")}
function textoCuentas(){return "Cuentas para transferencia a FITBOX:\n\n"+bancos().map(textoCuenta).join("\n\n")}
function guardarBancos(l){return write(()=>db.doc("config/general").set({...(S.config||{}),bancos:l}))}
function formBanco(i){
  const nuevo=i==null,b=nuevo?{}:bancos()[i];
  sheet({title:nuevo?"Nueva cuenta bancaria":"Editar cuenta",
    body:`<label>Banco<input name="banco" id="b-banco" value="${esc(b.banco)}" placeholder="Ej. BAC, FICOHSA" autocomplete="off"></label>
      <label>Número de cuenta<input name="numero" id="b-num" inputmode="numeric" value="${esc(b.numero)}" autocomplete="off"></label>

    onClick:(a,btn)=>{if(a==="borrar")confirmBtn(btn,async()=>{const l=[...bancos()];l.splice(i,1);if(await guardarBancos(l)){closeSheet();toast("Cuenta eliminada")}})},
    onSubmit:async d=>{const x={banco:d.banco.trim(),numero:soloNum(d.numero),tipo:d.tipo.trim(),titular:d.titular.trim().toUpperCase()};
      if(!x.banco)return "Escribe el nombre del banco.";if(!x.numero)return "Escribe el número de cuenta.";
      const l=[...bancos()];nuevo?l.push(x):l.splice(i,1,x);const ok=await guardarBancos(l);if(ok)toast("Cuenta guardada");return ok}});

function marcarCopiado(b){const a=b.querySelector(".act");if(!a)return;b.classList.add("ok");a.textContent="Copiado ✓";setTimeout(()=>{if(b.isConnected){b.classList.remove("ok");a.textContent="Copiar"}},1800)}

// ---------- reservas ----------
function horario(f){const c=cfg();return parse(f).getDay()===0?{ap:c.apDom,ci:c.ciDom}:{ap:c.apertura,ci:c.cierre}}
function horas(){const c=cfg(),o=[];for(let h=Math.min(c.apertura,c.apDom);h<Math.max(c.cierre,c.ciDom);h+=.5)o.push(h);return o}
function formReserva(pre){
  pre=pre||{};const c=cfg();
  const lista=[...S.clientes].filter(x=>!x.baja).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  sheet({title:"Reservar hora",
    body:`<label>Cliente<select name="clienteId" id="r-cli">${lista.map(x=>`<option value="${x.id}" ${x.id===pre.clienteId?"selected":""}>${esc(x.nombre)}${x.vence&&x.vence<today()?" (vencido)":""}</option>`).join("")}<option value="">Otra persona…</option></select></label>
      <label id="r-otro-l" ${lista.length?"hidden":""}>Nombre<input name="nombre" id="r-otro" autocomplete="off"></label>
      <div class="grid2"><label>Día<input type="date" name="fecha" id="r-fecha" value="${pre.fecha||agendaDay}"></label>
      <label>Hora<select name="inicio" id="r-hora">${horas().map(h=>`<option value="${h}" ${h===(pre.inicio??(c.apertura+3))?"selected":""}>${fh(h)}</option>`).join("")}</select></label></div>
      <label>Duración<select name="dur" id="r-dur"><option value="1">1 hora</option><option value="1.5">1 hora y media</option><option value="2">2 horas</option></select></label>
      <p class="sub" id="r-cupo"></p>`,
    submit:"Reservar",
    onInput:(f)=>{f.querySelector("#r-otro-l").hidden=!!f.clienteId.value;cupo(f)},
    onSubmit:async d=>{
      const ini=Number(d.inicio),dur=Number(d.dur);
      if(!d.clienteId&&!String(d.nombre||"").trim())return "Elige un cliente o escribe un nombre.";
      const hr=horario(d.fecha);if(ini<hr.ap||ini+dur>hr.ci)return "Ese día abres de "+fh(hr.ap)+" a "+fh(hr.ci)+". Elige un horario dentro de ese rango.";
      const m=maxOcup(d.fecha,ini,dur);if(m>=c.capacidad)return "No hay cupo: en ese horario ya hay "+m+" de "+c.capacidad+" personas. Prueba otra hora.";
      const ok=await add(COL.reservas,{clienteId:d.clienteId||null,nombre:d.clienteId?cli(d.clienteId).nombre:d.nombre.trim(),fecha:d.fecha,inicio:ini,dur});
      if(ok)toast("Reserva guardada");return ok}});
  const f=sheetEl.querySelector("form");cupo(f);

function maxOcup(fecha,ini,dur,skip){let m=0;for(let t=ini;t<ini+dur;t+=.5){const n=resDia(fecha).filter(r=>r.id!==skip&&overlaps(r,t,t+.5)).length;if(n>m)m=n}return m}
function cupo(f){const c=cfg();const m=maxOcup(f.fecha.value,Number(f.inicio.value),Number(f.dur.value));const libre=c.capacidad-m;
  f.querySelector("#r-cupo").innerHTML=libre>0?`Quedan <b>${libre}</b> de ${c.capacidad} lugares en ese horario.`:`<span class="neg">Ese horario está lleno.</span>`}

function duplicarMov(m){const {id,aprox,...copia}=m;formMov(m.tipo,{...copia,fecha:today()},true)}
function formMov(tipo,m,dup){
  const nuevo=!m||!m.id;m=m||{tipo,fecha:today(),categoria:tipo==="gasto"?"Otro":"Membresía",cuenta:cfg().cuentas[0],de:cfg().cuentas[0],a:cfg().cuentas[1]||cfg().cuentas[0]};

    body:`${dup?'<p class="sub">Es una copia con la fecha de hoy. Cambia lo que haga falta y toca <b>Guardar copia</b>.</p>':""}<div class="grid2"><label>Monto<input name="monto" id="m-monto" inputmode="decimal" value="${m.monto??""}"></label>

      ${tras?`<div class="grid2"><label>Sale de<select name="de" id="m-de">${cuentaOpts(m.de)}</select></label><label>Entra a<select name="a" id="m-a">${cuentaOpts(m.a)}</select></label></div><p class="sub">Un traspaso mueve dinero entre tus cuentas. No cuenta como ingreso ni como gasto.</p>`
      :`<div class="grid2"><label>Categoría<select name="categoria" id="m-cat">${cats.map(x=>`<option ${x===m.categoria?"selected":""}>${x}</option>`).join("")}</select></label>
      <label>${m.tipo==="gasto"?"Pagado con":"Entró a"}<select name="cuenta" id="m-cuenta">${cuentaOpts(m.cuenta||cfg().cuentas[0])}</select></label></div>`}
      <label>Descripción<input name="descripcion" id="m-desc" value="${esc(m.descripcion)}" placeholder="${tras?"Ej. depósito del efectivo de la semana":m.tipo==="gasto"?"Ej. recibo de luz de octubre":"Ej. venta de agua"}"></label>`,
    submit:dup?"Guardar copia":"Guardar",
    extra:nuevo?"":'<button type="button" data-s="dup">Duplicar</button><button type="button" class="danger" data-s="borrar">Eliminar</button>',
    onClick:(a,b)=>{if(a==="dup"){duplicarMov(m);return}if(a==="borrar")confirmBtn(b,async()=>{await del(COL.movs,m.id);closeSheet();toast("Movimiento eliminado")})},
    onSubmit:async d=>{const monto=parseFloat(String(d.monto).replace(",","."));if(!(monto>0))return "Escribe un monto mayor que cero.";
      if(tras&&d.de===d.a)return "Elige dos cuentas distintas.";
      const data=tras?{tipo:"traspaso",monto,fecha:d.fecha||today(),de:d.de,a:d.a,descripcion:d.descripcion.trim()}
        :{tipo:m.tipo,monto,fecha:d.fecha||today(),categoria:d.categoria,cuenta:d.cuenta,descripcion:d.descripcion.trim()};
      if(!nuevo&&m.aprox&&d.fecha!==m.fecha)data.aprox=false;

      if(c&&(!c.vence||c.vence<data.fecha))await upd(COL.clientes,c.id,{vence:data.fecha,baja:false});
      if(ok)toast(dup?"Copia guardada":"Guardado");return ok}});
}
function saldos(){const o={};cfg().cuentas.forEach(c=>o[c]=0);

  <section class="card"><h3>Gastos por categoría</h3>${barras(porCat(gas),"")}</section>

}

  <section class="card"><div class="row between"><h2>Insumos</h2><button class="small" data-a="nins">Agregar</button></div>

async function guardarArchivo(nombre,bytes,tipo){
  const file=new File([bytes],nombre,{type:tipo});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  const url=URL.createObjectURL(file),a=document.createElement("a");a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Excel descargado");
}
async function exportar(btn){
  if(!window.XLSX){toast("No se pudo preparar el Excel. Revisa tu conexión.");return}
  const D=s=>s?parse(s):null,cn=id=>cli(id)?.nombre||"";
  const clientes=[...S.clientes].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>({"Nombre":c.nombre,"Teléfono":c.telefono||"","Plan":c.plan||"","Inicio del plan":D(c.inicio),"Vence":D(c.vence),"Estado":c.baja?"De baja":estado(c).t,"Cliente desde":D(c.alta),"Total pagado":sum(S.movs.filter(m=>m.clienteId===c.id)),"Notas":c.notas||""}));
  const movs=[...S.movs].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>({"Fecha":D(m.fecha),"Mes":m.fecha.slice(0,7),"Tipo":m.tipo==="traspaso"?"Traspaso":m.tipo==="gasto"?"Gasto":"Ingreso","Categoría":m.tipo==="traspaso"?"":m.categoria,"Cuenta":m.tipo==="traspaso"?"":(m.cuenta||cfg().cuentas[0]),"Sale de":m.de||"","Entra a":m.a||"","Monto":Number(m.monto),"Monto con signo":m.tipo==="gasto"?-Number(m.monto):m.tipo==="ingreso"?Number(m.monto):0,"Descripción":m.descripcion||"","Cliente":cn(m.clienteId),"Fecha aproximada":m.aprox?"Sí":""}));
  const meses=[...new Set(S.movs.map(m=>m.fecha.slice(0,7)))].sort();
  const resumen=meses.map(k=>{const mm=movsMes(k),i=sum(mm.filter(m=>m.tipo==="ingreso")),g=sum(mm.filter(m=>m.tipo==="gasto"));return {"Mes":k,"Ingresos":i,"Gastos":g,"Ganancia":i-g,"Membresías":sum(mm.filter(m=>m.categoria==="Membresía")),"Pago por hora":sum(mm.filter(m=>m.categoria==="Pago por hora")),"Retiro personal":sum(mm.filter(m=>m.categoria==="Retiro personal")),"Préstamos dados":sum(mm.filter(m=>m.tipo==="gasto"&&m.categoria==="Préstamos"))}});
  const reservas=[...S.reservas].sort((a,b)=>(a.fecha+a.inicio).localeCompare(b.fecha+b.inicio)).map(r=>({"Fecha":D(r.fecha),"Hora":fh(r.inicio),"Horas":r.dur,"Cliente":nombreRes(r)}));
  const mant=S.mant.map(m=>({"Tarea":m.tarea,"Cada (días)":m.cada,"Última vez":D(m.ultima),"Próxima vez":D(m.proxima)}));
  const ins=S.insumos.map(i=>({"Insumo":i.nombre,"Estado":EST_INS[i.estado]?.[1]||i.estado}));
  const wb=XLSX.utils.book_new();
  const addS=(name,rows,head)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[Object.fromEntries(head.map(h=>[h,""]))],{cellDates:true,dateNF:"yyyy-mm-dd"});XLSX.utils.book_append_sheet(wb,ws,name)};
  addS("Clientes",clientes,["Nombre"]);addS("Movimientos",movs,["Fecha"]);addS("Resumen por mes",resumen,["Mes"]);
  addS("Reservas",reservas,["Fecha","Hora","Horas","Cliente"]);addS("Mantenimiento",mant,["Tarea"]);addS("Insumos",ins,["Insumo","Estado"]);
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true});
  btn.disabled=true;
  try{await guardarArchivo("FITBOX "+today()+".xlsx",new Uint8Array(buf),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}
  catch(e){if(e&&e.name!=="AbortError")toast("No se pudo descargar el Excel.")}
  finally{btn.disabled=false}
}
const VIEWS={panel:vPanel,clientes:vClientes,agenda:vAgenda,dinero:vDinero,mas:vMas};
function render(){
  const el=document.getElementById("view");
  const focused=document.activeElement&&document.activeElement.id==="busca",pos=focused?document.activeElement.selectionStart:0;
  el.innerHTML=VIEWS[view]();
  document.getElementById("vtitle").textContent=TITLES[view];
  document.getElementById("hoy").textContent=new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const fab=document.getElementById("fab"),F={clientes:"Nuevo cliente",agenda:"Reservar"};
  fab.hidden=!F[view];fab.textContent="+ "+(F[view]||"");
  if(focused){const b=document.getElementById("busca");b.focus();b.setSelectionRange(pos,pos)}
}

// ---------- eventos ----------

  tab:t=>{view=t.dataset.v;if(t.dataset.f)filtro=t.dataset.f;try{history.replaceState(null,"","#"+view)}catch(e){}render();window.scrollTo(0,0)},
  cli:t=>verCliente(t.dataset.id), cobrar:t=>{const c=cli(t.dataset.id);if(c)cobrar(c)},
  res:t=>verReserva(t.dataset.id), nueva:t=>formReserva({inicio:Number(t.dataset.h)}),
  filtro:t=>{filtro=t.dataset.f;render()},
  dia:t=>{agendaDay=t.dataset.d;render()}, semana:t=>{agendaDay=addDays(agendaDay,Number(t.dataset.d));render()},
  mes:t=>{mes=t.dataset.m;render()}, mov:t=>formMov(t.dataset.t), editmov:t=>{const m=S.movs.find(x=>x.id===t.dataset.id);if(m)formMov(m.tipo,m)},
  nmant:()=>formMant(), emant:t=>formMant(S.mant.find(x=>x.id===t.dataset.id)), hecho:t=>{const m=S.mant.find(x=>x.id===t.dataset.id);if(m)hecho(m)},
  nins:()=>formInsumo(), eins:t=>formInsumo(S.insumos.find(x=>x.id===t.dataset.id)),
  cicloins:t=>{const i=S.insumos.find(x=>x.id===t.dataset.id);if(i)upd(COL.insumos,i.id,{estado:{falta:"poco",poco:"hay",hay:"falta"}[i.estado]||"hay"})},
  wa:t=>{const c=cli(t.dataset.id);if(c)whats(c)},
  ncod:()=>formCodigo(), vcod:t=>verCodigo(t.dataset.id), envcod:()=>{const k=vigente();if(k)compartirCodigo(k)}, copcod:()=>{const k=vigente();if(k)copiar(k.codigo)},
  nbanco:()=>formBanco(), ebanco:t=>formBanco(Number(t.dataset.i)),
  copnum:async t=>{const b=bancos()[Number(t.dataset.i)];if(b&&await copiar(soloNum(b.numero),"Número de "+b.banco+" copiado"))marcarCopiado(t)},
  copcuentas:()=>copiar(textoCuentas(),"Cuentas copiadas"),
  ajustes:()=>formAjustes(), exportar:t=>exportar(t), salir:t=>confirmBtn(t,()=>window.GymDB.salir()),
};
document.addEventListener("click",e=>{if(sheetEl&&sheetEl.contains(e.target))return;const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a]){e.stopPropagation();A[t.dataset.a](t)}});
document.getElementById("fab").addEventListener("click",()=>{if(view==="clientes")formCliente();else formReserva({})});
document.addEventListener("input",e=>{if(e.target.id==="busca"){busca=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const h0=(location.hash||"").slice(1);if(VIEWS[h0])view=h0;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==view){view=h;render()}});
setInterval(()=>{if(!sheetEl)render()},60000);
render();

// ---------- baja automática: más de 30 días vencido ----------
let autoDone=false;
async function autoBaja(){
  if(autoDone||!db)return;autoDone=true;const h=today();
  const l=S.clientes.filter(c=>!c.baja&&c.vence&&diff(c.vence,h)>30&&!(c.reactivado&&diff(c.reactivado,h)<=30));
  for(const c of l)await upd(COL.clientes,c.id,{baja:true,bajaAuto:h});
  if(l.length)toast(l.length+(l.length===1?" cliente pasó":" clientes pasaron")+" a De baja por llevar más de un mes vencidos");
}

// ---------- datos ----------
(async()=>{
  try{db=await window.GymDB.conectar()}catch(e){db=null}
  if(!db){S.dbOk=false;render();return}
  S.dbOk=true;
  const onErr=()=>{S.dbOk=false;render()};
  for(const [k,col] of Object.entries(COL)){
    db.collection(col).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render();if(k==="clientes"&&!(s.metadata&&s.metadata.fromCache))autoBaja()},onErr);
  }
  db.doc("config/general").onSnapshot(s=>{S.config=s.exists?s.data():null;render()},onErr);
})();
})();
